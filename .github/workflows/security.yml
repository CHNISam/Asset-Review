name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . bandit pip-audit
      - run: bandit -r asset_viewer
      - run: pip-audit -r requirements-release.txt
      - run: pip-audit -r requirements-release.txt -f cyclonedx-json -o asset-viewer-sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-viewer-sbom-${{ github.sha }}
          path: asset-viewer-sbom.cdx.json
          if-no-files-found: error
