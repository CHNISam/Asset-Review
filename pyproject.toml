[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-asset-viewer"
version = "0.10.0"
description = "Local-first visual review gallery for AI-generated and project image folders."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "TheSpyglassofOdysseus"}]
keywords = ["image-review", "asset-management", "ai-agents", "gallery", "local-first", "creative-workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = ["Pillow>=12.1.1,<13", "waitress>=3.0.2,<4", "watchdog>=6.0,<7", "tomli>=2,<3; python_version < '3.11'"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
asset-viewer = "asset_viewer.cli:main"
asset-viewer-mcp = "asset_viewer.mcp_server:main"

[project.urls]
Homepage = "https://github.com/CHNISam/Asset-Review"
Repository = "https://github.com/CHNISam/Asset-Review"
Issues = "https://github.com/CHNISam/Asset-Review/issues"
Upstream = "https://github.com/TheSpyglassofOdysseus/asset-viewer"

[tool.setuptools]
packages = ["asset_viewer"]
include-package-data = false

[tool.setuptools.package-data]
asset_viewer = ["static/*"]
