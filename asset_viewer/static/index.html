<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="dark light">
  <title>Asset Review</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app-shell">
  <aside id="collectionRail" class="collection-rail">
    <div class="rail-head">
      <button id="projectSwitcher" class="project-switcher" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="projectMenu"><span class="mark" aria-hidden="true"></span><span class="switcher-text"><strong id="switcherName">Asset Review</strong><small id="switcherMeta"></small></span><span class="chevron" aria-hidden="true"></span></button>
      <div id="projectMenu" class="project-menu hidden" role="menu" aria-label="切换项目"><input id="projectMenuSearch" class="hidden" type="search" placeholder="查找项目" aria-label="查找项目"><div id="projectMenuList"></div></div>
    </div>
    <nav id="collectionNav" class="collection-nav" aria-label="项目内容"></nav>
    <div class="rail-footer"><span>Asset Review</span><button id="themeToggle" class="rail-icon" type="button" title="主题：自动" aria-label="切换主题"><span id="themeLabel" class="visually-hidden">主题：自动</span><span aria-hidden="true">◐</span></button><button id="paletteHint" class="rail-icon" type="button" title="命令面板 (Ctrl K)" aria-label="命令面板"><kbd>Ctrl K</kbd></button></div>
  </aside>

  <section class="workspace">
    <header class="topbar">
      <div class="collection-context">
        <span id="scopeLabel" class="eyebrow"></span>
        <div class="collection-title-row"><h1 id="collectionTitle">Asset Review</h1><select id="actions" class="menu-select" aria-label="集合操作" title="更多操作"><option value="">⋯</option></select></div>
        <span id="summary">载入中…</span>
      </div>
      <nav class="workspace-tabs" aria-label="工作区">
        <button id="tabGallery" class="workspace-tab active" type="button" data-workspace-tab="gallery">素材</button>
        <button id="tabActivity" class="workspace-tab" type="button" data-workspace-tab="activity">记录</button>
        <button id="tabApproved" class="workspace-tab" type="button" data-workspace-tab="approved" title="已通过素材的交付清单">交付</button>
      </nav>
      <div class="search-wrap"><span aria-hidden="true" class="search-icon"></span><input id="search" type="search" placeholder="搜索" title="名称、意见、来源；支持 status: use: scene: 等字段" aria-label="搜索素材"><kbd class="search-kbd">/</kbd></div>
    </header>

    <div class="toolbar">
      <div id="statusChips" class="status-chips" role="group" aria-label="按状态筛选"></div><span id="workspaceCount" class="workspace-count"></span>
      <select id="filter" class="visually-hidden" tabindex="-1" aria-hidden="true"><option value="all">全部</option><option value="new">新</option><option value="unreviewed">待审</option><option value="approved">通过</option><option value="maybe">待定</option><option value="rejected">拒绝</option></select>
      <div id="facetBar" class="facet-bar" aria-label="范围">
        <label class="mobile-only mobile-collection"><span>集合</span><select id="collection" aria-label="集合"></select></label>
        <label class="mobile-only"><span>项目</span><select id="projectFilter" aria-label="项目"></select></label>
        <label class="mobile-only"><span>场景</span><select id="sceneFilter" aria-label="场景"></select></label>
        <label><span>用途</span><select id="useFilter" aria-label="用途"><option value="all">全部</option></select></label>
        <label><span>视图</span><select id="view" aria-label="视图"><option value="gallery">素材</option><option value="activity">记录</option></select></label>
      </div>
      <div class="toolbar-actions">
        <button id="filtersToggle" class="filters-toggle" type="button" aria-expanded="false" aria-controls="facetBar">筛选</button>
        <select id="sort" aria-label="排序"><option value="newest">最新</option><option value="oldest">最早</option><option value="name">名称</option><option value="status">状态</option><option value="size">大小</option><option value="resolution">分辨率</option></select>
        <label class="density" title="缩略图大小"><span aria-hidden="true" class="density-icon"></span><input id="density" type="range" min="0" max="2" step="1" value="1" aria-label="缩略图大小"></label>
        <button id="selectionMode" type="button" aria-pressed="false">多选</button>
        <button id="quickReviewLaunch" class="primary" type="button" title="按当前筛选逐张审核">快审</button>
      </div>
    </div>

    <div id="bulkbar" class="bulkbar hidden"><strong id="selectedCount">选择</strong><span id="selectionScopeNote"></span><button id="selectAllVisible" type="button">全选</button><button id="clearSelection" type="button">清空</button><select id="selectionAction" aria-label="批量操作"><option value="">批量…</option></select></div>

    <main class="workspace-main">
      <div class="content-frame">
        <section id="galleryView"><div id="empty" class="empty hidden"><strong>没有素材</strong><span>调整筛选，或用 <code>asset-viewer add 路径</code> 登记素材目录。</span></div><div id="grid" class="grid" data-density="1"></div></section>
        <section id="activityView" class="activity-view hidden"><div class="activity-heading"><strong>记录</strong><span id="activitySummary"></span></div><div id="activityList" class="activity-list"></div></section>
        <aside id="approvedPanel" class="approved-panel hidden" aria-label="交付">
          <div class="approved-ready"><span class="approved-check" aria-hidden="true">✓</span><div><strong id="approvedCount">0 项通过</strong><span id="approvedSummaryText"></span></div></div>
          <button id="approvedHandoff" class="primary" type="button" title="导出 JSON 清单，不移动或改写原文件">导出交付清单</button>
          <button id="approvedReport" type="button">审核报告</button>
          <div id="approvedMeta" class="approved-meta"></div>
        </aside>
      </div>
    </main>
  </section>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="commandPalette" class="command-palette hidden" role="dialog" aria-modal="true" aria-label="命令面板"><div class="command-box"><input id="commandSearch" type="search" autocomplete="off" placeholder="输入命令" aria-label="搜索命令"><div id="commandList" class="command-list" role="listbox"></div><span class="command-hint">↵ 执行 · ↑↓ 选择 · Esc 关闭</span></div></div>

<section id="quickReview" class="quick-review hidden" role="dialog" aria-modal="true" aria-labelledby="quickReviewTitle">
  <header class="quick-review-header"><div><span id="quickReviewKicker" class="quick-review-kicker">快审</span><strong id="quickReviewTitle">准备中…</strong><span id="quickReviewDetails" class="quick-review-details"></span></div><div class="quick-review-header-actions"><span id="quickReviewStatus" class="status-pill">待审</span><button id="closeQuickReview" type="button" aria-label="退出快速审核">退出 <kbd>Esc</kbd></button></div></header>
  <div class="quick-review-stage"><img id="quickReviewImage" alt=""><video id="quickReviewVideo" class="hidden" controls playsinline preload="metadata"></video></div>
  <section class="quick-review-controls" aria-label="快速审核操作"><div class="quick-review-progress"><span id="quickReviewProgress" aria-live="polite">0 / 0</span><div class="quick-review-progress-track" aria-hidden="true"><span id="quickReviewProgressBar"></span></div></div><div class="quick-review-actions"><button id="quickReviewPrevious" class="ghost" type="button" aria-label="上一张">←</button><button id="quickReviewApprove" class="decision approve" type="button">通过 <kbd>1</kbd></button><button id="quickReviewMaybe" class="decision maybe" type="button">待定 <kbd>2</kbd></button><button id="quickReviewReject" class="decision reject" type="button">拒绝 <kbd>3</kbd></button><button id="quickReviewNext" class="ghost" type="button" aria-label="跳过并查看下一张">→</button></div><div class="quick-review-secondary"><button id="quickReviewDetailsButton" class="ghost" type="button" title="打开详情，可加标注">详情</button><button id="quickReviewCompare" class="ghost" type="button" title="与上一张对比">对比</button><button id="quickReviewUndo" class="ghost" type="button">撤销 <kbd>Ctrl Z</kbd></button></div></section>
  <details id="quickReviewNote" class="quick-review-note"><summary>意见 <kbd>N</kbd></summary><div><textarea id="quickReviewComment" maxlength="10000" placeholder="给下一轮的修改意见" aria-label="意见"></textarea><span id="quickReviewCommentState" class="save-state"></span></div></details>
  <nav id="quickReviewFilmstrip" class="quick-review-filmstrip" aria-label="快速审核胶片带"></nav>
</section>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="素材审核">
  <section class="stage">
    <div class="stage-bar"><span id="stagePosition" class="stage-position"></span><span id="zoomLevel" class="zoom-level" title="滚轮缩放 · 拖动平移 · 双击切换 100%">适应</span><button class="icon-button close" id="close" type="button" aria-label="关闭">×</button></div>
    <div id="stageViewport" class="stage-viewport">
      <button class="icon-button nav prev" id="prev" type="button" aria-label="上一项">‹</button>
      <div id="imageSurface" class="image-surface"><img id="full" alt="" draggable="false"><video id="videoFull" class="hidden" controls playsinline preload="metadata"></video><div id="annotationLayer" class="annotation-layer" aria-label="空间批注"></div></div>
      <button class="icon-button nav next" id="next" type="button" aria-label="下一项">›</button>
    </div>
  </section>
  <aside class="inspector">
    <div class="identity-row"><div class="identity"><strong id="filename"></strong><span id="details"></span><span id="previewNotice" class="preview-notice hidden"></span></div><span id="reviewDecision" class="status-pill">待审</span><select id="assetActions" class="menu-select" aria-label="素材操作" title="更多操作"><option value="">⋯</option></select></div>
    <span id="reviewQuestion" class="review-question"></span>
    <div id="reviewStatus" class="decision-group" role="radiogroup" aria-label="审核状态">
      <button type="button" class="decision approve" data-status="approved" role="radio" aria-checked="false">通过 <kbd>1</kbd></button>
      <button type="button" class="decision maybe" data-status="maybe" role="radio" aria-checked="false">待定 <kbd>2</kbd></button>
      <button type="button" class="decision reject" data-status="rejected" role="radio" aria-checked="false">拒绝 <kbd>3</kbd></button>
    </div>
    <div id="familyRow" class="family-row hidden"><div><strong id="familyName"></strong><span id="familyMeta"></span></div><select id="familyActions" class="menu-select" aria-label="版本组操作"><option value="">⋯</option></select></div>
    <div class="field"><label for="comment">意见</label><textarea id="comment" maxlength="10000" placeholder="给下一轮的修改意见"></textarea><span id="commentState" class="save-state"></span></div>
    <div class="field annotation-field">
      <label>标注</label>
      <div class="annotation-toolbar"><div id="annotationMode" class="segmented" role="group" aria-label="批注模式"><button type="button" data-mode="point" aria-pressed="false">点</button><button type="button" data-mode="region" aria-pressed="false">区域</button></div><input id="annotationText" maxlength="4000" placeholder="写意见，再在图上点或框" aria-label="标注意见"></div>
      <span id="annotationHelp" class="hint"></span>
      <div id="annotationPanel" class="annotation-panel hidden"></div>
    </div>
    <details id="detailsPanel" class="details-panel"><summary>来源</summary><div id="provenanceContent" class="provenance-content"></div></details>
    <div id="historyPanel" class="history-panel hidden"></div>
  </aside>
</div>

<div id="compareModal" class="modal compare-modal hidden" role="dialog" aria-modal="true" aria-label="比较选中素材"><section class="compare-stage"><div class="compare-heading"><div><strong>对比</strong><span id="compareHint"></span></div><div class="compare-controls"><select id="compareMode" aria-label="比较模式"><option value="side">并排</option><option value="overlay">叠加</option><option value="difference">差异</option></select><select id="compareLink" aria-label="缩放行为"><option value="linked">联动</option><option value="independent">独立</option></select><select id="compareActions" class="menu-select" aria-label="对比操作" title="更多操作"><option value="">⋯</option><option value="reset">重置视图</option></select><label id="overlayControl" class="overlay-control hidden">混合 <input id="overlayRange" type="range" min="0" max="100" value="50"></label><button class="icon-button" id="closeCompare" type="button" aria-label="关闭比较">×</button></div></div><div id="compareGrid" class="compare-grid"></div></section></div>
<script src="/app.js"></script>
</body></html>
